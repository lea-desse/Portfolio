
<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Léa Desse | Ingénieure Logiciel Embarqué</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <style>
        :root {
            --cyber-sage: #22c55e;
            --sage-dark: #1a2e1a;
            --sage-glow: rgba(34, 197, 94, 0.2);
        }
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #ffffff;
            color: #0f170f;
            margin: 0;
            padding: 0;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .gradient-text {
            background: linear-gradient(to right, #166534, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .neon-border { box-shadow: 0 0 15px var(--sage-glow); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f0fdf4; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #22c55e;
            border-radius: 10px;
        }
        ::selection {
            background-color: #dcfce7;
            color: #166534;
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(34, 197, 94, 0.05), transparent);
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body class="scanline">
    <div id="root"></div>
    <!-- Point d'entrée de l'application -->
    <script type="module" src="./index.tsx"></script>
</body>
</html>
